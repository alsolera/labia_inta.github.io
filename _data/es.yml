home:
  eyebrow: "Grupo de investigación · INTA"
  title: "Laboratorio de Dinámica de Fluidos y Aerodinámica basada en datos"
  lede: "Explorando la intersección entre la mecánica de fluidos experimental y computacional, el modelado de orden reducido y el aprendizaje profundo."
  cta_research: "Líneas de investigación"
  cta_pubs: "Publicaciones"
  figure_caption: "campo de flujo / instantánea PIV"
  group_label: "El grupo"
  group_lead: "Somos un grupo de investigación aeroespacial del Instituto Nacional de Técnica Aeroespacial (INTA), con sede en el Campus La Marañosa, en Madrid."
  group_body: "Nuestra investigación une la dinámica de fluidos computacional (CFD) clásica y la aerodinámica experimental de alta fidelidad con arquitecturas modernas de aprendizaje automático (β-VAEs, modelos generativos y transformers) para desarrollar sustitutos aerodinámicos en tiempo real, técnicas de superresolución de flujo y sistemas de control activo de flujo."
  pillars_title: "Líneas principales"
  pillars_all: "Todas las líneas →"
  recent_label: "Publicaciones recientes"
  recent_all: "Ver todas →"
  news_label: "Actualidad"
  locations_label: "Afiliaciones y sedes"

pillars:
  - n: "01"
    title: "Modelado de orden reducido no lineal (ROM)"
    body: "Codificación de estructuras coherentes turbulentas espacio-temporales en variedades latentes compactas mediante autocodificadores variacionales β, y predicción de la dinámica multiescala con transformers."
  - n: "02"
    title: "Control activo de flujo basado en datos (AFC)"
    body: "Diseño de marcos de control en lazo cerrado y control predictivo por modelo (MPC) para la reducción de resistencia aerodinámica y la manipulación de estelas no estacionarias."
  - n: "03"
    title: "Superresolución y diagnóstico de flujo"
    body: "Reconstrucción de campos de velocidad y presión de alta resolución a partir de redes dispersas de sensores y técnicas ópticas de medida."
  - n: "04"
    title: "Capas límite y turbulencia de pared"
    body: "Análisis experimental y numérico a alto número de Reynolds de capas límite turbulentas sometidas a gradiente de presión adverso (APG)."

