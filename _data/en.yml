home:
  eyebrow: "Joint research group · INTA · UC3M"
  title: "Data-Driven Fluid Dynamics & Aerodynamics Lab"
  lede: "Pioneering the intersection of experimental/computational fluid mechanics, reduced-order modeling, and deep learning."
  cta_research: "Research lines"
  cta_pubs: "Publications"
  figure_caption: "flow-field / PIV snapshot"
  group_label: "The group"
  group_lead: "We are a joint aerospace research group operating across the National Institute for Aerospace Technology (INTA) and Universidad Carlos III de Madrid (UC3M)."
  group_body: "Our research bridges classical computational fluid dynamics (CFD) and high-fidelity experimental aerodynamics with modern machine learning architectures (β-VAEs, generative models, and transformers) to develop real-time aerodynamic surrogates, flow super-resolution techniques, and active flow control systems."
  pillars_title: "Core research pillars"
  pillars_all: "All research lines →"
  recent_label: "Recent publications"
  recent_all: "See all →"
  news_label: "Latest news"
  locations_label: "Affiliations & locations"

pillars:
  - n: "01"
    title: "Nonlinear Reduced-Order Modeling (ROM)"
    body: "Encoding complex spatio-temporal turbulent coherent structures into compact latent manifolds via β-Variational Autoencoders and predicting multi-scale dynamics with Transformers."
  - n: "02"
    title: "Data-Driven Active Flow Control (AFC)"
    body: "Designing closed-loop and model-predictive control (MPC) frameworks for aerodynamic drag reduction and unsteady wake manipulation."
  - n: "03"
    title: "Flow Super-Resolution & Diagnostics"
    body: "Reconstructing high-resolution velocity and pressure fields from sparse sensor arrays and optical measurement techniques."
  - n: "04"
    title: "Boundary Layers & Wall Turbulence"
    body: "High-Reynolds-number experimental and numerical analysis of turbulent boundary layers subject to adverse pressure gradients (APG)."

