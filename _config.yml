# ── Site ──────────────────────────────────────────────────────────────
title: "AeroML — Data-Driven Fluid Dynamics & Aerodynamics Lab"
name: "AeroML"
description: "Research group on machine learning, turbulence and aerodynamics at INTA, Madrid."
# Repo is AeroML-INTA/AeroML-INTA.github.io → served at the org root, so baseurl is empty.
# If the repo is ever renamed back to AeroML-INTA, set baseurl to "/AeroML-INTA".
url: "https://aeroml-inta.github.io"
baseurl: ""
repository: "AeroML-INTA/AeroML-INTA.github.io"
lang: en
locale: en_US

# ── Build ─────────────────────────────────────────────────────────────
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - README.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      lang: en

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
