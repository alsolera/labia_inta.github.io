# ── Site ──────────────────────────────────────────────────────────────
title: "AeroML — Data-Driven Fluid Dynamics & Aerodynamics Lab"
name: "AeroML"
description: "Joint research group on machine learning, turbulence and aerodynamics — INTA & Universidad Carlos III de Madrid."
# Repo is AeroML-INTA/AeroML-INTA → served from a sub-path, so baseurl carries the repo name.
# If the repo is ever renamed to AeroML-INTA.github.io, set baseurl back to "".
url: "https://aeroml-inta.github.io"
baseurl: "/AeroML-INTA"
repository: "AeroML-INTA/AeroML-INTA"
lang: en
locale: en_US

# ── Build ─────────────────────────────────────────────────────────────
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - README.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      lang: en

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
