name: Build check

# Builds the site on every branch and pull request without deploying it,
# so a broken build is caught before it reaches master. Deployment lives
# in pages.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # A green build does not mean a correct page: a bad Liquid lookup
      # resolves to nil and renders as an empty string without erroring.
      # These assertions fail if the templates stop emitting real text.
      - name: Check rendered content
        run: |
          set -euo pipefail
          fail=0
          check() {
            if grep -qF "$2" "$1"; then
              echo "ok   $1: $2"
            else
              echo "FAIL $1: expected '$2'"
              fail=1
            fi
          }
          # Strings that come from _data/en.yml and es.yml through the `t`
          # lookup, so a nil `t` fails these rather than passing silently.
          check _site/index.html "Core research pillars"
          check _site/index.html "Research group · INTA"
          check _site/es/index.html "Líneas de investigación"
          check _site/es/index.html "Grupo de investigación · INTA"
          check _site/contact/index.html "Get in touch"
          check _site/contact/index.html "Marañosa"

          # Strings that come from the content data files.
          check _site/team/index.html "Sanmiguel"
          check _site/publications/index.html "Nature Communications"
          check _site/research/index.html "Active Flow Control"
          check _site/projects/index.html "As principal investigator"
          check _site/projects/index.html "PREVENT"
          check _site/projects/index.html "COTURB"
          check _site/es/proyectos/index.html "Como investigador principal"
          check _site/es/proyectos/index.html "TIFON"

          # The group is affiliated with INTA only. Collaborators keep their
          # own UC3M affiliations, so this is checked where it must not appear.
          absent() {
            if grep -qF "$2" "$1"; then
              echo "FAIL $1: '$2' should not appear here"
              fail=1
            else
              echo "ok   $1: no '$2'"
            fi
          }
          # Logos must be referenced and actually shipped: the simplified
          # mark in the nav, the full one large in the hero.
          check _site/index.html "logo-mark.svg"
          check _site/index.html "logo-light.svg"
          check _site/es/index.html "logo-mark.svg"
          for f in logo.svg logo-mark.svg logo-light.svg; do
            if [ -f "_site/images/$f" ]; then
              echo "ok   _site/images/$f exists"
            else
              echo "FAIL _site/images/$f missing"
              fail=1
            fi
          done

          absent _site/index.html "Carlos III"
          absent _site/contact/index.html "Carlos III"
          absent _site/es/index.html "Carlos III"

          # Empty nav labels are the signature of the nil-lookup bug.
          if grep -qE '<a href="[^"]*"[^>]*></a>' _site/index.html; then
            echo "FAIL _site/index.html: empty nav link text"
            fail=1
          else
            echo "ok   _site/index.html: nav links have labels"
          fi

          exit $fail
