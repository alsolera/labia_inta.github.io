<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 44" width="96" height="44" role="img" aria-labelledby="aeroml-mark-title">
  <title id="aeroml-mark-title">AeroML</title>
  <defs>
    <linearGradient id="aeroml-mark-flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="0">
      <stop offset="0" stop-color="#171b2b"/>
      <stop offset="0.45" stop-color="#171b2b"/>
      <stop offset="0.95" stop-color="#4b3f9e"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- two streamlines, one smooth curve each, into the two input nodes -->
    <path d="M2 9 C22 2.6, 42 4.2, 60.4 11.4"
          stroke="url(#aeroml-mark-flow)" stroke-width="2"/>
    <path d="M3 15 C22 9.5, 44 14, 60.5 27.2"
          stroke="url(#aeroml-mark-flow)" stroke-width="2"/>

    <!-- airfoil: same profile as the full mark -->
    <path d="M51 32.9 C41 26.9, 30 20.8, 20.8 21.5 C13.4 22.1, 7.3 25.8, 8.5 29.4
             C9.5 32.8, 18.5 34.4, 30 34.4 C40 34.4, 47 33.5, 51 32.9 Z"
          stroke="#171b2b" stroke-width="3"/>

    <!-- reduced network: 2 - 2, fully connected -->
    <g stroke="#4b3f9e" stroke-width="1.5">
      <path d="M64 13 L86 13"/>
      <path d="M64 13 L86 29"/>
      <path d="M64 29 L86 13"/>
      <path d="M64 29 L86 29"/>
    </g>
  </g>

  <g fill="#f9f8f6" stroke="#4b3f9e" stroke-width="2">
    <circle cx="64" cy="13" r="3.8"/>
    <circle cx="64" cy="29" r="3.8"/>
    <circle cx="86" cy="13" r="3.8"/>
    <circle cx="86" cy="29" r="3.8"/>
  </g>
</svg>
